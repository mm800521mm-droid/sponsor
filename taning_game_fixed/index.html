<script>
(function () {
  'use strict';

  const loreContainer = document.getElementById('lore-container');
  if (loreContainer) {
    const floatingLoreTexts = [
      "当年剧团合伙人之一 —— 惨案幸存的主角",
      "遇害者之一，孩童形态的执念人偶",
      "前剧团安保，事发当晚在场，精神崩溃",
      "剧团技术总管，知道内情却被迫沉默"
    ];
    const lorePositions = ['lore-tr', 'lore-mt', 'lore-mr', 'lore-bl'];
    floatingLoreTexts.forEach((text, index) => {
      const el = document.createElement('div');
      el.className = `drifting-lore ${lorePositions[index % 4]}`;
      el.innerText = text;
      loreContainer.appendChild(el);
    });
  }

  const mainMenu = document.getElementById('main-menu');
  const menuNew = document.getElementById('menu-new');
  const menuCont = document.getElementById('menu-continue');
  const gameEl = document.getElementById('game');
  const scene = document.getElementById('scene');
  const dustContainer = document.getElementById('dustContainer');
  const btnCam = document.getElementById('btnCam');
  const cameraPanel = document.getElementById('camera-panel');
  const btnCamClose = document.getElementById('btnCamClose');
  const camTitle = document.getElementById('cam-title');
  const camFeedContainer = document.getElementById('cam-feed-container');
  const camBtns = document.querySelectorAll('.cam-btn');
  const camScenes = document.querySelectorAll('.cam-scene');
  const nightLabels = document.querySelectorAll('#nightLabel');
  const clockEls = document.querySelectorAll('#clock');
  const powerTexts = document.querySelectorAll('#powerText b');
  const usageBars = document.querySelectorAll('#usageBars i');
  const powerBoxes = document.querySelectorAll('#powerBox');
  const clearOverlay = document.getElementById('night-clear-overlay');
  const clearSubtitle = document.getElementById('clear-subtitle');
  const btnReturnMenu = document.getElementById('btnReturnMenu');
  const jumpscareOverlay = document.getElementById('jumpscare-overlay');
  let fluxScareActive = false;
  let fluxScareToken = 0;
  const pendingJumpscares = [];

  const btnLookBack = document.getElementById('btnLookBack');
  const backView = document.getElementById('back-view');
  let isLookingBack = false;
  let lookBackTimer = 0;

  let currentView = 0, targetView = 0;
  let isCamOpen = false;
  let elevenCameraBlackout = false;
  let highestNight = (window.RIFT_NIGHT_TRANSITIONS && window.RIFT_NIGHT_TRANSITIONS.getHighestNight()) || 1;

  function setElevenCameraBlackout(enabled) {
    elevenCameraBlackout = !!enabled;
    if (elevenCameraBlackout) {
      if (isCamOpen) {
        isCamOpen = false;
        cameraPanel.classList.remove('show');
        playMonitorSound(false);
      }
      cameraPanel.classList.add('eleven-blackout');
      camTitle.innerText = 'SIGNAL LOST // ALL CAMERAS OFFLINE';
      camBtns.forEach(btn => btn.classList.remove('on'));
      camScenes.forEach(feed => feed.classList.remove('active'));
      const staticFeed = document.getElementById('cam-static');
      if (staticFeed) staticFeed.style.display = 'block';
    } else {
      cameraPanel.classList.remove('eleven-blackout');
      const staticFeed = document.getElementById('cam-static');
      if (staticFeed) staticFeed.style.display = '';
    }
  }

  // 第六夜演出模块通过此接口控制监控；保安室状态仍由主页面管理。
  window.RIFT_NIGHT6_API = {
    blackoutCameras: (enabled) => setElevenCameraBlackout(enabled)
  };
  let currentTapePlayId = 0;
  let currentCamId = 1;

  const NIGHT_MS = 8 * 60 * 1000;
  const HOUR_MS = 60 * 1000;
  
  const S = { night: 1, elapsed: 0, hour: 0, power: 100, running: false, ended: false };
  window.RIFT_GET_NIGHT = () => S.night;
  let processedNightEvents = new Set();
  let activeNightSettings = null;

  function playJumpscareSound() {
    try {
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const duration = 0.72;
      const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * duration), audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const fade = Math.pow(1 - i / data.length, 1.8);
        data[i] = (Math.random() * 2 - 1) * fade;
      }
      const noise = audioCtx.createBufferSource(); noise.buffer = buffer;

  function dispatchNightSpecialTimes() {
    if (!activeNightSettings || !Array.isArray(activeNightSettings.specialTimes)) return;
    const gameMinute = Math.floor((S.elapsed / HOUR_MS) * 60);
    for (const event of activeNightSettings.specialTimes) {
      if (processedNightEvents.has(event.id)) continue;
      const parts = String(event.at || '00:00').split(':').map(Number);
      const targetMinute = (parts[0] || 0) * 60 + (parts[1] || 0);
      if (gameMinute >= targetMinute) {
        processedNightEvents.add(event.id);
        window.dispatchEvent(new CustomEvent('rift:night-special-time', { detail: { night: S.night, ...event } }));
        console.info('[Rift Ash] Night special time:', event.id, event.at, event.type);

        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
        noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = buffer; noiseNode.loop = true;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1200;
        gainNode = audioCtx.createGain(); gainNode.gain.value = 0.015;
        noiseNode.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); noiseNode.start();
        typeNoiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
        const typeData = typeNoiseBuffer.getChannelData(0);
        for (let i = 0; i < typeData.length; i++) { typeData[i] = Math.random() * 2 - 1; }

      if (audioCtx.state === 'suspended') audioCtx.resume();

  function playFootstepSound(type) {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(); 
      osc.type = 'sine'; 
      
      let startFreq = 50;
      let volume = 0.3;
      let duration = 0.3;
      
      if (type === 'distant') { startFreq = 40; volume = 0.2; duration = 0.2; }
      else if (type === 'close') { startFreq = 60; volume = 0.5; duration = 0.4; }
      else if (type === 'charge') { startFreq = 100; volume = 0.9; duration = 0.5; }
      
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(10, now + duration);
      
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + duration);
    } catch(e) {}
  }

  function triggerFluxPriorityScare() {
    if (S.ended || fluxScareActive) return;
    fluxScareActive = true;
    window.RIFT_FLUX_PRIORITY_SCARE_ACTIVE = true;
    const token = ++fluxScareToken;
    const overlay = document.createElement('div');
    overlay.id = 'rift-flux-priority-scare';
    overlay.setAttribute('aria-hidden', 'true');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:all;';
    const face = document.createElement('canvas');
    face.width = 900; face.height = 900;
    face.style.cssText = 'width:min(96vmin,900px);height:min(96vmin,900px);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 34px #b00000);animation:scareShake .055s infinite;';
    overlay.appendChild(face);
    document.body.appendChild(overlay);
    drawRiftCharacterJumpscareFace(face, 'Flux');
    playJumpscareSound();
    // The night clock and game loop keep running behind this opaque face.
    // Other characters' jumpscares are queued and begin only after Flux clears.
    window.dispatchEvent(new CustomEvent('rift:flux-priority-scare-start'));
    setTimeout(() => {
      if (token !== fluxScareToken) return;
      overlay.remove();
      fluxScareActive = false;
      window.RIFT_FLUX_PRIORITY_SCARE_ACTIVE = false;
      window.dispatchEvent(new CustomEvent('rift:flux-priority-scare-end'));
      const next = pendingJumpscares.shift();
      if (next && !S.ended) triggerJumpscare(next.name, next.quote);
    }, 2300);
  }

  function triggerJumpscare(name, quote) {
    if (S.ended) return;
    if (/闪流|Flux/i.test(String(name || ''))) {
      triggerFluxPriorityScare();
      return;
    }
    if (fluxScareActive) {
      if (!pendingJumpscares.some(item => item.name === name)) pendingJumpscares.push({name, quote});
      return;
    }
    S.ended = true;
    S.running = false;
    releaseAllLights();
    if (isCamOpen) {
      isCamOpen = false;
      cameraPanel.classList.remove('show');
    }
    const faceCanvas = document.getElementById('jumpscare-face-model');
    const isEleven = /十一|Gilded Eleven/i.test(String(name || ''));
    if (faceCanvas) {
      if (isEleven && window.drawGildedElevenJumpscareFace) {
        window.drawGildedElevenJumpscareFace(faceCanvas);
      } else if (/塔宁|Tannin/i.test(String(name || '')) && window.drawTanninJumpscareFace) {
        window.drawTanninJumpscareFace(faceCanvas, true);
      } else {
        drawRiftCharacterJumpscareFace(faceCanvas, name);
      }
    }
    jumpscareOverlay.classList.remove('gameover');
    jumpscareOverlay.classList.add('show');
    playJumpscareSound();

    // Direct pixel-face close-up first; no abstract placeholder face.
    setTimeout(() => jumpscareOverlay.classList.add('gameover'), 900);
    setTimeout(() => location.reload(), 6500);
  }

  async function playTape(tapeLines, audioFile) {
    if (!tapeLines || tapeLines.length === 0) return;
    const tapeUi = document.getElementById('tape-ui');
    const tapeSub = document.getElementById('tape-sub');
    const tapeStatus = document.getElementById('tape-status');
    const tapeAudio = document.getElementById('tape-audio');
    const myPlayId = ++currentTapePlayId;

    // 每次播放前停止上一段录音，避免跨夜串音。
    tapeAudio.pause();
    tapeAudio.removeAttribute('src');
    tapeAudio.load();
    tapeSub.replaceChildren();
    tapeSub.classList.remove('tape-box-glitch');
    tapeSub.style.opacity = '1';
    tapeUi.style.display = 'flex';
    tapeStatus.textContent = 'LOADING TAPE...';

    // 有录音文件就播放；文件不存在、格式不支持或自动播放被拦截时，
    // 自动退回纯字幕模式，不影响夜晚开始。
    let hasAudio = false;
    if (audioFile) {
      hasAudio = await new Promise(resolve => {
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          tapeAudio.removeEventListener('error', onError);
          resolve(value);
        };
        const onError = () => finish(false);
        const timeoutId = setTimeout(() => finish(false), 4000);
        tapeAudio.addEventListener('error', onError, { once: true });
        tapeAudio.src = audioFile;
        tapeAudio.load();
        try {
          Promise.resolve(tapeAudio.play()).then(() => finish(true)).catch(() => finish(false));
        } catch (err) {
          finish(false);
        }
      });
    }

    if (myPlayId !== currentTapePlayId) {
      tapeAudio.pause();
      return;
    }

    tapeStatus.textContent = hasAudio ? 'PLAYING TAPE...' : 'SUBTITLE TRANSCRIPT';

    // 计算可见字符数，控制符本身不计入音频字幕速度。
    const commandPattern = /(\*\d+(?:\.\d+)?|\/|\[(?:red|cyan|yellow|gray|white|shake|glitch|blink|big|fade|normal|boxglitch|speed=\d+(?:\.\d+)?)\])/g;
    const visibleText = tapeLines.map(line => String(line).replace(commandPattern, '')).join('');
    const totalChars = Math.max(1, Array.from(visibleText).length);
    const audioCharDelay = hasAudio && Number.isFinite(tapeAudio.duration) && tapeAudio.duration > 0
      ? Math.max(25, Math.min(160, tapeAudio.duration * 1000 / totalChars)) : 35;

    const punctuation = '，。！？；：,.!?;:……';
    const supportedEffects = ['red', 'cyan', 'yellow', 'gray', 'white', 'shake', 'glitch', 'blink', 'big', 'fade'];

    const waitFor = ms => new Promise(resolve => setTimeout(resolve, Math.max(0, ms)));
    const stillPlaying = () => S.running && myPlayId === currentTapePlayId;

    function appendTapeChar(char, effects) {
      const span = document.createElement('span');
      span.className = 'tape-char';
      effects.forEach(effect => span.classList.add('tape-' + effect));
      span.textContent = char;
      tapeSub.appendChild(span);
    }

    for (let lineIndex = 0; lineIndex < tapeLines.length; lineIndex++) {
      if (!stillPlaying()) break;

      const line = String(tapeLines[lineIndex]);
      tapeSub.replaceChildren();
      tapeSub.classList.remove('tape-box-glitch');
      tapeSub.style.opacity = '1';

      const state = { effects: [], speed: hasAudio ? audioCharDelay : 35 };
      const tokens = line.split(commandPattern);

      for (const token of tokens) {
        if (!stillPlaying()) break;
        if (!token) continue;

        // /：在当前字幕中换行。
        if (token === '/') {
          tapeSub.appendChild(document.createElement('br'));
          continue;
        }

        // *5 或 *1.5：暂停指定秒数。
        if (/^\*\d+(?:\.\d+)?$/.test(token)) {
          await waitFor(Number(token.slice(1)) * 1000);
          if (!stillPlaying()) break;
          continue;
        }

        // [特效]：设置后续文字的效果。
        if (token.startsWith('[') && token.endsWith(']')) {
          const command = token.slice(1, -1);

          if (command === 'normal') {
            state.effects = [];
            state.speed = hasAudio ? audioCharDelay : 35;
            tapeSub.classList.remove('tape-box-glitch');
          } else if (command === 'boxglitch') {
            tapeSub.classList.add('tape-box-glitch');
          } else if (command.startsWith('speed=')) {
            const newSpeed = Number(command.slice(6));
            if (Number.isFinite(newSpeed)) state.speed = Math.max(0, newSpeed);
          } else if (supportedEffects.includes(command) && !state.effects.includes(command)) {
            state.effects.push(command);
          }
          continue;
        }

        // 普通文字逐字显示；特效只作用于控制符之后的字符。
        for (const char of Array.from(token)) {
          if (!stillPlaying()) break;
          appendTapeChar(char, state.effects);

          if (!hasAudio && char !== ' ' && !punctuation.includes(char)) {
            playTypeSound();
          }

          const delay = punctuation.includes(char)
            ? (hasAudio ? Math.max(120, audioCharDelay) : 180)
            : state.speed;
          await waitFor(delay);
        }
      }

      if (!stillPlaying()) break;

      // 一行结束后稍作停留，再淡出进入下一行。
      const visibleLineLength = Array.from(line.replace(commandPattern, '')).length;
      await waitFor(hasAudio ? 250 : 900 + visibleLineLength * 45);
      if (!stillPlaying()) break;

      tapeSub.style.opacity = '0';
      await waitFor(350);
    }

    if (myPlayId === currentTapePlayId) {
      tapeSub.classList.remove('tape-box-glitch');
      tapeUi.style.display = 'none';
      tapeSub.style.opacity = '0';
      // 若录音比字幕略长，让录音自然播完；下一夜开始时再统一停止。
    }
  }

      dispatchNightSpecialTimes();
      let currentHour = Math.min(8, Math.floor(S.elapsed / HOUR_MS));
      if (currentHour !== S.hour || (S.night === 6 && S.elapsed >= 9.25 * HOUR_MS)) {
        S.hour = currentHour;
        if (S.elapsed >= (S.night === 6 ? 9.25 : 8) * HOUR_MS) {
          S.running = false;
          releaseAllLights();
          playWinSound();
          highestNight = Math.max(highestNight, S.night + 1);
          if (window.RIFT_NIGHT_TRANSITIONS) {
            window.RIFT_NIGHT_TRANSITIONS.completeNight({
              night: S.night,
              startNight: startNight
            });
          } else {
            clearSubtitle.innerText = `NIGHT ${S.night} COMPLETE`;
            clearOverlay.classList.add('show');
          }
        }
      }

      if (S.running) {
        let usage = COST.base;
        if (dL) usage += COST.door;
        if (dR) usage += COST.door;
        if (btnLlight.classList.contains('on')) usage += COST.light;
        if (btnRlight.classList.contains('on')) usage += COST.light;
        if (isCamOpen) usage += COST.cam;

        // Night 6 lasts 9.25 in-game minutes and includes Lobe's time rollback; ease the drain so the longer shift remains survivable.
        const nightPowerMultiplier = S.night === 6 ? 0.80 : 1;
        S.power = Math.max(0, S.power - usage * dt * nightPowerMultiplier);
        if (S.power <= 0) {
          S.running = false;
          releaseAllLights();
          if (isCamOpen) {
            isCamOpen = false;
            cameraPanel.classList.remove('show');
          }
          document.getElementById('tape-ui').style.display = 'none';
          document.getElementById('tape-sub').style.opacity = '0';
          document.getElementById('clear-title').innerText = (S.hour === 0 ? '12' : S.hour) + ' AM';
          clearSubtitle.innerText = 'POWER OUT';
          clearOverlay.classList.add('show');
        }
      }

      if (S.running) {
        const characterDt = window.RIFT_FLUX_PRIORITY_SCARE_ACTIVE ? 0 : dt;
        window.dispatchEvent(new CustomEvent('rift:game-frame',{detail:{night:S.night,elapsed:S.elapsed,dt:characterDt,running:S.running,camOpen:isCamOpen,camId:currentCamId,leftClosed:dL,rightClosed:dR}}));
        if (isLookingBack) {
          lookBackTimer -= dt;
          if (lookBackTimer <= 0 && !backView.classList.contains('warning')) backView.classList.add('warning');
        }
        if (typeof taning !== 'undefined') {
          try { taning.update(characterDt, GameContext); } catch (e) { console.error('Taning AI update failed:', e); }
        }
        if (typeof gildedEleven !== 'undefined') {
          try { gildedEleven.update(characterDt, GameContext); } catch (e) { console.error('Gilded Eleven AI update failed:', e); }
        }
      }
      updateUI();
    }

    applyView(dt);
    rafHandle = requestAnimationFrame(gameLoop);
  }

  function startNight(nightNum, customSettings=null, customLabel='') {
      if (Number(nightNum) === 6) {
        try {
          if (localStorage.getItem('riftAsh.night6Returned') !== '1') {
            localStorage.setItem('riftAsh.night6VisitPending', '1');
          }
        } catch (_) {}
      }

    if (window.speechSynthesis) window.speechSynthesis.cancel();
    currentTapePlayId++;
    const tapeAudio = document.getElementById('tape-audio');
    if (tapeAudio) { tapeAudio.pause(); tapeAudio.removeAttribute('src'); tapeAudio.load(); }
    document.getElementById('tape-ui').style.display = 'none';
    document.getElementById('tape-sub').style.opacity = '0';
    document.getElementById('tape-sub').textContent = '';
    
    clearOverlay.classList.remove('show', 'rift-clock-flip', 'rift-night-clear');
    document.getElementById('clear-title').innerText = '8 AM';
    backView.classList.remove('show', 'warning');
    jumpscareOverlay.classList.remove('show');
    fluxScareToken++; fluxScareActive = false; window.RIFT_FLUX_PRIORITY_SCARE_ACTIVE = false; pendingJumpscares.length = 0;
    const fluxOverlay = document.getElementById('rift-flux-priority-scare'); if (fluxOverlay) fluxOverlay.remove();
    isLookingBack = false;
    setElevenCameraBlackout(false);
    releaseAllLights();
    
    S.night = nightNum;
    activeNightSettings = customSettings || (window.NIGHT_SETTINGS && window.NIGHT_SETTINGS[nightNum]) || { characters: {}, alwaysPresent: ['noka'], specialTimes: [] };
    window.RIFT_CURRENT_AI_LEVELS = customSettings ? { ...(customSettings.characters || {}) } : null;
    processedNightEvents = new Set();
    window.RIFT_NIGHT_STATE = { night: nightNum, settings: activeNightSettings };
    window.dispatchEvent(new CustomEvent('rift:night-start', { detail: { night: nightNum, settings: activeNightSettings } }));
    S.elapsed = 0;
    S.hour = 0;
    S.power = 100;
    S.running = true;
    S.ended = false;
    
    dL = false; dR = false;
    doorwayL.classList.remove('closed'); doorwayR.classList.remove('closed');
    btnLdoor.classList.remove('on'); btnRdoor.classList.remove('on');
    btnLlight.classList.remove('on'); btnRlight.classList.remove('on');
    doorwayL.classList.remove('lit'); doorwayR.classList.remove('lit');
    if (isCamOpen) {
      isCamOpen = false;
      cameraPanel.classList.remove('show');
    }
    
    currentView = 0; targetView = 0;
    currentCamId = 1;
    switchCam(1);
    scene.style.transform = 'translateX(-33.3333%)';

    let currentNightData = null;
    // 最稳妥的获取方式，直接读取变量，不依赖 window 对象
    const nightDataSource = window.NIGHT_DATA;
    if (nightDataSource && nightDataSource[nightNum]) {
      currentNightData = nightDataSource[nightNum];
    } else {
      console.error('[电话系统] 未找到 NIGHT_DATA[' + nightNum + ']。请检查 ./data.js 是否成功加载。', nightDataSource);
      currentNightData = { nightName: 'NIGHT ' + nightNum, tape: ["（系统提示：电话字幕数据未加载，请检查 data.js 文件及其路径。）"] };
    }
    
    let nightTitle = customLabel || currentNightData.nightName;
    nightLabels.forEach(el => el.innerText = nightTitle);
    
    if (typeof taning !== 'undefined') {
        try {
          const roster = activeNightSettings.characters || {};
          taning.setAILevel(Number(roster.tannin ?? 0));
          taning.reset(GameContext);
        } catch(e) { console.error('Could not apply Tannin night AI:', e); }
    }
    if (typeof gildedEleven !== 'undefined') {
      try { gildedEleven.startNight(nightNum, activeNightSettings, GameContext); }
      catch(e) { console.error('Could not apply Gilded Eleven night AI:', e); }
    }
    (activeNightSettings.alwaysPresent || []).forEach(id => {
      window.dispatchEvent(new CustomEvent('rift:character-presence', { detail: { night: nightNum, id, alwaysPresent: true, aiControlled: false } }));
    });
    
    updateUI();

    if (currentNightData.tape && currentNightData.tape.length > 0) {
      playTape(currentNightData.tape, currentNightData.audioFile || `audio/Night_Video_${nightNum}.mp3`);
    }

    lastTime = performance.now();
  }

  btnReturnMenu.onclick = function() { location.reload(); };
  window.addEventListener('rift:return-to-menu', () => location.reload());

  if (highestNight > 1) {
    menuCont.classList.remove('disabled');
    const continueNight = Math.min(highestNight, 5);
    menuCont.innerText = `继续（第 ${continueNight} 夜）`;
    menuCont.onclick = function() {
      if(window.RIFT_LORE_SYSTEM){window.RIFT_LORE_SYSTEM.beginShift(continueNight,()=>{mainMenu.style.display='none';gameEl.style.display='block';initAudio();startNight(continueNight);});return;}
      mainMenu.style.display = 'none'; gameEl.style.display = 'block'; initAudio(); startNight(continueNight);
    };
  }

  menuNew.onclick = function() { if(window.RIFT_LORE_SYSTEM){window.RIFT_LORE_SYSTEM.beginShift(1,()=>{mainMenu.style.display='none';gameEl.style.display='block';initAudio();startNight(1);});return;} mainMenu.style.display = 'none'; gameEl.style.display = 'block'; initAudio(); startNight(1); };

  const menuNightSix = document.getElementById('menu-night-six');
  const menuCustomNight = document.getElementById('menu-custom-night');
  if (highestNight >= 6) { menuNightSix.style.display = 'block'; menuCustomNight.style.display = 'block'; }
  // The first Night 6 visit is entered normally. Its return arms the menu hover reveal.
  try {
    if (localStorage.getItem('riftAsh.night6VisitPending') === '1') {
      localStorage.removeItem('riftAsh.night6VisitPending');
      localStorage.setItem('riftAsh.night6Returned', '1');
    }
  } catch (_) {}
  menuNightSix.addEventListener('mouseenter', function() {
    try { if (localStorage.getItem('riftAsh.night6Returned') === '1') mainMenu.classList.add('rift-night-six-hover'); } catch (_) {}
  });
  menuNightSix.addEventListener('mouseleave', function() { mainMenu.classList.remove('rift-night-six-hover'); });
  menuNightSix.onclick = function() {
    try { if (localStorage.getItem('riftAsh.night6Returned') !== '1') localStorage.setItem('riftAsh.night6VisitPending', '1'); } catch (_) {}
    mainMenu.classList.remove('rift-night-six-hover');
    mainMenu.style.display = 'none'; gameEl.style.display = 'block'; initAudio(); startNight(6);
  };
  menuCustomNight.onclick = function() {
    const toggle = document.getElementById('rift-dev-toggle');
    const panel = document.getElementById('rift-dev-panel');
    if (!document.body.classList.contains('rift-debug-unlocked') || !panel) return;
    panel.classList.add('open');
    if (toggle) toggle.textContent = '关闭测试面板 ▾';
    const base = panel.querySelector('#dev-custom-base');
    if (base) base.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  const debugBtns = document.querySelectorAll('.debug-btn');
  debugBtns.forEach(btn => {
    btn.onclick = function() {
      mainMenu.style.display = 'none';
      gameEl.style.display = 'block';
      initAudio();
      startNight(parseInt(this.dataset.night));
    };
  });

  requestAnimationFrame(gameLoop);

})();
</script>
